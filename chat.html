<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>盛语 - 智能助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fff;
      --side: #f6f7f9;
      --side-hover: #eceef1;
      --ink: #0d0d0d;
      --muted: #8b8b8b;
      --line: #ececec;
      --chip: #f2f3f5;
      --shadow: 0 8px 28px rgba(16, 16, 16, 0.08);
      --radius: 24px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--bg);
      overflow: hidden;
    }

    button, textarea { font-family: inherit; }

    .app {
      display: flex;
      height: 100%;
    }

    .sidebar {
      width: 260px;
      background: var(--side);
      display: flex;
      flex-direction: column;
      padding: 16px 10px 12px;
      flex-shrink: 0;
      transition: width 0.2s, padding 0.2s, opacity 0.2s;
    }

    .sidebar.collapsed {
      width: 0;
      padding: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px 18px;
      font-weight: 700;
      font-size: 18px;
    }

    .logo {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      background: linear-gradient(180deg, #6aa8ff, #3b6cff);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 14px;
      box-shadow: 0 6px 14px rgba(59, 108, 255, 0.28);
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
    }

    .nav-btn:hover, .nav-btn.active { background: var(--side-hover); }

    .nav-btn svg, .icon-btn svg { flex-shrink: 0; }

    .kbd {
      margin-left: auto;
      color: var(--muted);
      font-size: 11px;
    }

    .recent-label {
      color: var(--muted);
      font-size: 12px;
      padding: 16px 12px 8px;
    }

    .recent-list {
      flex: 1;
      overflow: auto;
    }

    .recent-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      color: #333;
    }

    .recent-item:hover, .recent-item.active { background: var(--side-hover); }

    .recent-item span {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .recent-item .del {
      display: none;
      border: 0;
      background: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
    }

    .recent-item:hover .del { display: block; }

    .empty-recent {
      color: var(--muted);
      font-size: 12px;
      padding: 4px 12px;
    }

    .side-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 8px 4px;
      border-top: 1px solid var(--line);
      margin-top: 8px;
    }

    .side-foot button {
      border: 0;
      background: none;
      cursor: pointer;
      color: #555;
      font-size: 13px;
      padding: 6px 8px;
      border-radius: 8px;
    }

    .side-foot button:hover { background: var(--side-hover); }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .topbar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border: 0;
      background: none;
      border-radius: 8px;
      cursor: pointer;
      color: #333;
      display: grid;
      place-items: center;
    }

    .icon-btn:hover { background: var(--chip); }

    .top-actions { display: flex; gap: 8px; align-items: center; }

    .pill {
      border: 1px solid #dbe7ff;
      background: #fff;
      color: #2b6dff;
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
    }

    .login {
      background: #111;
      color: #fff;
      border: 0;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
    }

    .stage {
      flex: 1;
      overflow: auto;
      display: flex;
      flex-direction: column;
    }

    .home {
      margin: auto;
      width: min(720px, calc(100% - 48px));
      text-align: center;
      padding-bottom: 24px;
    }

    .home h1 {
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 700;
      letter-spacing: 0.01em;
      margin-bottom: 22px;
    }

    .tabs {
      display: inline-flex;
      background: var(--chip);
      border-radius: 999px;
      padding: 4px;
      margin-bottom: 8px;
    }

    .tabs button {
      border: 0;
      background: transparent;
      min-width: 96px;
      padding: 8px 22px;
      border-radius: 999px;
      cursor: pointer;
      color: #666;
      font-size: 15px;
    }

    .tabs button.active {
      background: #fff;
      color: var(--ink);
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .thread {
      width: min(820px, calc(100% - 48px));
      margin: 0 auto;
      padding: 12px 0 24px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .msg { display: flex; gap: 12px; align-items: flex-start; }

    .msg.user { justify-content: flex-end; }

    .bubble {
      max-width: 78%;
      line-height: 1.75;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user .bubble {
      background: #f2f3f5;
      border-radius: 18px 18px 6px 18px;
      padding: 10px 14px;
    }

    .msg.bot .bubble { padding: 2px 0; }

    .avatar-bot {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(180deg, #6aa8ff, #3b6cff);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .typing {
      display: inline-flex;
      gap: 4px;
      padding-top: 8px;
    }

    .typing i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #bbb;
      animation: bounce 1s infinite;
    }

    .typing i:nth-child(2) { animation-delay: 0.15s; }
    .typing i:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-4px); opacity: 1; }
    }

    .dock {
      width: min(760px, calc(100% - 36px));
      margin: 0 auto 22px;
      flex-shrink: 0;
    }

    .composer {
      background: #fff;
      border: 1px solid #ececec;
      border-radius: 26px;
      box-shadow: var(--shadow);
      padding: 12px 14px 10px;
    }

    .composer textarea {
      width: 100%;
      border: 0;
      outline: none;
      resize: none;
      font-size: 15px;
      line-height: 1.6;
      min-height: 28px;
      max-height: 160px;
      background: transparent;
    }

    .tools {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }

    .tool {
      border: 0;
      background: transparent;
      color: #444;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .tool:hover, .tool.active { background: var(--chip); }

    .tools .spacer { flex: 1; }

    .send {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: #111;
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .send:disabled { background: #f0f0f0; color: #999; cursor: default; }

    .hints {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 14px;
    }

    .hint {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 13px;
      color: #444;
      cursor: pointer;
    }

    .hint:hover { background: var(--chip); }

    .hidden { display: none !important; }

    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.28);
      display: grid;
      place-items: center;
      z-index: 20;
    }

    .modal {
      width: min(440px, calc(100% - 32px));
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .modal h3 { font-size: 18px; margin-bottom: 14px; }

    .modal label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin: 10px 0 6px;
    }

    .modal input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
    }

    .modal .row {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    .modal .row button {
      border: 0;
      border-radius: 10px;
      padding: 8px 14px;
      cursor: pointer;
    }

    .ghost { background: var(--chip); }
    .primary { background: #111; color: #fff; }

    .menu {
      position: absolute;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 6px;
      z-index: 10;
      min-width: 160px;
    }

    .menu button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: none;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    .menu button:hover { background: var(--chip); }

    @media (max-width: 800px) {
      .sidebar {
        position: absolute;
        inset: 0 auto 0 0;
        z-index: 8;
        height: 100%;
        box-shadow: 8px 0 24px rgba(0,0,0,0.06);
      }
      .pill { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="logo">盛</div>盛语</div>
      <button class="nav-btn" id="newWork">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h10v14H4z"/><path d="M14 8h6v11h-6z"/><path d="M8 9h2M8 13h2"/></svg>
        新工作任务
      </button>
      <button class="nav-btn" id="newChat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 6h14v9H8l-3 3V6z"/></svg>
        新对话 <span class="kbd">Ctrl ⇧ K</span>
      </button>
      <button class="nav-btn" id="openProjects">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h7l2 2h9v10H3z"/></svg>
        项目
      </button>
      <button class="nav-btn" id="openApi">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="12" r="2"/><circle cx="18" cy="7" r="2"/><circle cx="18" cy="17" r="2"/><path d="M8 12h8M16 9l-6 2M16 15l-6-2"/></svg>
        API 服务
      </button>
      <div class="recent-label">最近</div>
      <div class="recent-list" id="recentList"></div>
      <div class="side-foot">
        <button id="aboutBtn">关于盛语</button>
        <button id="settingsBtn">设置</button>
      </div>
    </aside>

    <section class="main">
      <header class="topbar">
        <button class="icon-btn" id="toggleSide" title="收起侧栏">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h10M4 18h16"/></svg>
        </button>
        <div class="top-actions">
          <button class="pill" id="hintBtn">在线聊天</button>
          <button class="login" id="userBtn">李江盛</button>
        </div>
      </header>

      <div class="stage" id="stage">
        <div class="home" id="home">
          <h1>有什么我能帮你的吗?</h1>
          <div class="tabs">
            <button class="active" data-mode="chat">对话</button>
            <button data-mode="work">工作</button>
          </div>
        </div>
        <div class="thread hidden" id="thread"></div>
      </div>

      <div class="dock">
        <div class="composer">
          <textarea id="input" rows="1" placeholder="发消息..."></textarea>
          <div class="tools">
            <button class="tool" id="plusBtn" title="更多">＋</button>
            <button class="tool active" data-skill="对话">对话</button>
            <button class="tool" data-skill="PPT 生成">PPT 生成</button>
            <button class="tool" data-skill="帮我写作">帮我写作</button>
            <button class="tool" id="moreSkill">更多</button>
            <div class="spacer"></div>
            <button class="tool" id="modelBtn">快速</button>
            <button class="send" id="sendBtn" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
            </button>
          </div>
        </div>
        <div class="hints" id="hints">
          <button class="hint">帮我写一封请假邮件</button>
          <button class="hint">用三句话介绍李江盛</button>
          <button class="hint">给这个简历页起个更好的标题</button>
        </div>
      </div>
    </section>
  </div>

  <div class="menu hidden" id="skillMenu">
    <button data-skill="图像生成">图像生成</button>
    <button data-skill="翻译">翻译</button>
    <button data-skill="网页摘要">网页摘要</button>
  </div>

  <div class="modal-mask hidden" id="mask">
    <div class="modal">
      <h3 id="modalTitle">API 服务</h3>
      <p id="modalDesc" style="color:#888;font-size:13px;line-height:1.6;margin-bottom:8px;"></p>
      <div id="apiFields">
        <label>接口地址</label>
        <input id="apiBase" placeholder="https://api.openai.com/v1 或留空使用默认" />
        <label>API Key（可选）</label>
        <input id="apiKey" type="password" placeholder="不填则走免费默认接口" />
        <label>模型</label>
        <input id="apiModel" placeholder="openai" />
      </div>
      <div class="row">
        <button class="ghost" id="closeModal">取消</button>
        <button class="primary" id="saveModal">保存</button>
      </div>
    </div>
  </div>

  <script>
    const storeKey = "shengyu.v1";
    const defaultSettings = { base: "", key: "", model: "openai" };
    const state = {
      mode: "chat",
      skill: "对话",
      chats: [],
      currentId: null,
      busy: false,
      settings: { ...defaultSettings }
    };

    const $ = (id) => document.getElementById(id);
    const input = $("input");
    const sendBtn = $("sendBtn");
    const thread = $("thread");
    const home = $("home");
    const hints = $("hints");

    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

    function load() {
      try {
        const raw = JSON.parse(localStorage.getItem(storeKey) || "{}");
        state.chats = raw.chats || [];
        state.settings = { ...defaultSettings, ...(raw.settings || {}) };
      } catch (e) { state.chats = []; }
    }

    function save() {
      localStorage.setItem(storeKey, JSON.stringify({ chats: state.chats, settings: state.settings }));
    }

    function current() {
      return state.chats.find((c) => c.id === state.currentId);
    }

    function renderRecent() {
      const box = $("recentList");
      if (!state.chats.length) {
        box.innerHTML = '<div class="empty-recent">还没有对话</div>';
        return;
      }
      box.innerHTML = state.chats.map((c) => `
        <div class="recent-item ${c.id === state.currentId ? "active" : ""}" data-id="${c.id}">
          <span>${escapeHtml(c.title)}</span>
          <button class="del" data-del="${c.id}">×</button>
        </div>
      `).join("");
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }

    function showHome() {
      home.classList.remove("hidden");
      thread.classList.add("hidden");
      thread.innerHTML = "";
      hints.classList.remove("hidden");
    }

    function showThread() {
      home.classList.add("hidden");
      thread.classList.remove("hidden");
      hints.classList.add("hidden");
    }

    function renderThread() {
      const chat = current();
      if (!chat || !chat.messages.length) {
        showHome();
        renderRecent();
        return;
      }
      showThread();
      thread.innerHTML = chat.messages.map((m) => {
        if (m.role === "user") {
          return `<div class="msg user"><div class="bubble">${escapeHtml(m.content)}</div></div>`;
        }
        return `<div class="msg bot"><div class="avatar-bot"></div><div class="bubble">${m.pending ? '<span class="typing"><i></i><i></i><i></i></span>' : escapeHtml(m.content)}</div></div>`;
      }).join("");
      $("stage").scrollTop = $("stage").scrollHeight;
      renderRecent();
    }

    function newChat(mode) {
      if (mode) state.mode = mode;
      state.currentId = null;
      document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("active", b.dataset.mode === state.mode));
      input.placeholder = state.mode === "work" ? "说一个要处理的任务..." : "发消息...";
      renderThread();
      input.focus();
    }

    function ensureChat() {
      if (current()) return current();
      const chat = { id: uid(), title: "新对话", messages: [], mode: state.mode, updated: Date.now() };
      state.chats.unshift(chat);
      state.currentId = chat.id;
      save();
      return chat;
    }

    function autosize() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 160) + "px";
      sendBtn.disabled = !input.value.trim() || state.busy;
    }

    function setSkill(name) {
      state.skill = name;
      document.querySelectorAll("[data-skill]").forEach((b) => b.classList.toggle("active", b.dataset.skill === name));
    }

    async function reply(messages) {
      const sys = state.mode === "work"
        ? "你是盛语，一个中文工作助手。把用户的事拆成可执行步骤，直接给结果，少客套。不要编造李江盛或其他人的学历、公司、奖项。"
        : "你是盛语，一个中文智能助手。语气自然、简洁、好用。不要自称豆包。李江盛是本站主人；被问及时不要编造他的学历、任职和奖项，不知道就明说。";
      const skillHint = state.skill && state.skill !== "对话" ? `\n当前技能：${state.skill}。请按这个方向回答。` : "";
      const payload = {
        model: state.settings.model || "openai",
        messages: [{ role: "system", content: sys + skillHint }, ...messages.map((m) => ({ role: m.role, content: m.content }))]
      };

      const base = (state.settings.base || "https://text.pollinations.ai/openai").replace(/\/$/, "");
      const url = base.endsWith("/chat/completions") ? base : (base.endsWith("/openai") ? base : base + "/chat/completions");
      const headers = { "Content-Type": "application/json" };
      if (state.settings.key) headers.Authorization = "Bearer " + state.settings.key;

      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 25000);
      const res = await fetch(url, { method: "POST", headers, body: JSON.stringify(payload), signal: ctrl.signal });
      clearTimeout(timer);
      if (!res.ok) throw new Error("接口 " + res.status);
      const data = await res.json();
      const text = data.choices?.[0]?.message?.content || data.content || data.text;
      if (!text) throw new Error("空回复");
      return String(text).trim();
    }

    function fallbackReply(text) {
      if (state.skill === "PPT 生成") return "可以按这个大纲做 PPT：\n1. 封面与主题\n2. 背景与目标\n3. 关键内容 3 页\n4. 方案或结论\n5. 下一步\n\n把主题再发我，我按页写正文。";
      if (state.skill === "帮我写作") return "我可以帮你写。先告诉我：给谁看、什么场合、大概多长、要正式还是口语。你刚才说的是：\n「" + text + "」";
      if (state.mode === "work") return "这件事可以拆成三步：\n1. 先明确目标和截止时间\n2. 列出必须交付的结果\n3. 按顺序做，做完再检查\n\n你补充一下截止时间和完成标准，我帮你排出具体清单。";
      return "我是盛语。你刚才说：「" + text + "」\n\n我这边暂时连不上在线模型，所以先给你这个本地回复。打开左侧「API 服务」填入接口后，就可以真正对话。";
    }

    async function send(text) {
      const value = (text || input.value).trim();
      if (!value || state.busy) return;
      const chat = ensureChat();
      if (chat.messages.length === 0) chat.title = value.slice(0, 18);
      chat.messages.push({ role: "user", content: value });
      chat.messages.push({ role: "assistant", content: "", pending: true });
      chat.updated = Date.now();
      input.value = "";
      autosize();
      state.busy = true;
      renderThread();

      const history = chat.messages.filter((m) => !m.pending).map((m) => ({ role: m.role, content: m.content }));
      let out = "";
      try {
        out = await reply(history);
      } catch (e) {
        out = fallbackReply(value);
      }

      const last = chat.messages[chat.messages.length - 1];
      last.pending = false;
      last.content = "";
      renderThread();
      for (const ch of out) {
        last.content += ch;
        const bubbles = thread.querySelectorAll(".msg.bot .bubble");
        const el = bubbles[bubbles.length - 1];
        if (el) el.textContent = last.content;
        $("stage").scrollTop = $("stage").scrollHeight;
        await new Promise((r) => setTimeout(r, 8));
      }
      save();
      state.busy = false;
      autosize();
      renderRecent();
    }

    function openModal(kind) {
      const mask = $("mask");
      const title = $("modalTitle");
      const desc = $("modalDesc");
      const fields = $("apiFields");
      if (kind === "about") {
        title.textContent = "关于盛语";
        desc.textContent = "盛语是一个参考豆包网页版布局做的在线聊天页。对话记录存在这台浏览器里。左侧 API 服务可以接 OpenAI 兼容接口。";
        fields.classList.add("hidden");
      } else if (kind === "projects") {
        title.textContent = "项目";
        desc.textContent = "项目用来收一组长对话。这一版先把聊天跑通，项目分组可以后补。";
        fields.classList.add("hidden");
      } else {
        title.textContent = "API 服务";
        desc.textContent = "默认使用免费在线接口。要换成自己的模型，填 OpenAI 兼容地址和 Key。";
        fields.classList.remove("hidden");
        $("apiBase").value = state.settings.base;
        $("apiKey").value = state.settings.key;
        $("apiModel").value = state.settings.model;
      }
      mask.dataset.kind = kind;
      mask.classList.remove("hidden");
    }

    $("toggleSide").onclick = () => $("sidebar").classList.toggle("collapsed");
    $("newChat").onclick = () => newChat("chat");
    $("newWork").onclick = () => newChat("work");
    $("openApi").onclick = () => openModal("api");
    $("settingsBtn").onclick = () => openModal("api");
    $("aboutBtn").onclick = () => openModal("about");
    $("openProjects").onclick = () => openModal("projects");
    $("closeModal").onclick = () => $("mask").classList.add("hidden");
    $("saveModal").onclick = () => {
      if ($("mask").dataset.kind === "api") {
        state.settings.base = $("apiBase").value.trim();
        state.settings.key = $("apiKey").value.trim();
        state.settings.model = $("apiModel").value.trim() || "openai";
        save();
      }
      $("mask").classList.add("hidden");
    };

    document.querySelectorAll(".tabs button").forEach((btn) => {
      btn.onclick = () => newChat(btn.dataset.mode);
    });

    document.querySelectorAll(".composer [data-skill]").forEach((btn) => {
      btn.onclick = () => setSkill(btn.dataset.skill);
    });

    $("moreSkill").onclick = (e) => {
      const menu = $("skillMenu");
      const r = e.currentTarget.getBoundingClientRect();
      menu.style.left = r.left + "px";
      menu.style.bottom = (window.innerHeight - r.top + 8) + "px";
      menu.classList.toggle("hidden");
    };

    $("skillMenu").onclick = (e) => {
      const btn = e.target.closest("[data-skill]");
      if (!btn) return;
      setSkill(btn.dataset.skill);
      $("skillMenu").classList.add("hidden");
    };

    $("recentList").onclick = (e) => {
      const del = e.target.closest("[data-del]");
      if (del) {
        state.chats = state.chats.filter((c) => c.id !== del.dataset.del);
        if (state.currentId === del.dataset.del) state.currentId = null;
        save();
        renderThread();
        return;
      }
      const item = e.target.closest("[data-id]");
      if (!item) return;
      state.currentId = item.dataset.id;
      const chat = current();
      if (chat) state.mode = chat.mode || "chat";
      renderThread();
    };

    hints.onclick = (e) => {
      const b = e.target.closest(".hint");
      if (b) send(b.textContent);
    };

    sendBtn.onclick = () => send();
    input.addEventListener("input", autosize);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "k") {
        e.preventDefault();
        newChat("chat");
      }
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest("#moreSkill") && !e.target.closest("#skillMenu")) {
        $("skillMenu").classList.add("hidden");
      }
    });

    load();
    renderRecent();
    autosize();
    input.focus();
  </script>
</body>
</html>
